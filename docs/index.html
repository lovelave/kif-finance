<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="refresh"
            content="5;url=https://lovilave.com.ua/docs"
        />
        <title>Сайт більше не доступний</title>
        <style>
            body {
                font-family: system-ui, -apple-system, sans-serif;
                line-height: 1.6;
                margin: 0;
                padding: 20px;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f0f4f8;
                color: #1a365d;
            }

            .container {
                max-width: 600px;
                text-align: center;
                padding: 40px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            }

            h1 {
                font-size: 2em;
                margin-bottom: 1em;
                color: #2d3748;
            }

            .new-link {
                display: inline-block;
                margin-top: 2em;
                padding: 12px 24px;
                background: #4299e1;
                color: white;
                text-decoration: none;
                border-radius: 4px;
                transition: background 0.2s;
            }

            .new-link:hover {
                background: #3182ce;
            }

            .timer {
                color: #718096;
                margin-top: 1.5em;
                font-size: 0.9em;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>⚠️ Сайт більше не доступний</h1>

            <p>
                Даний веб-ресурс припинив свою роботу. Всі актуальні документи
                та матеріали тепер доступні на нашому новому сайті.
            </p>

            <a href="https://lovilave.com.ua/docs" class="new-link">
                Перейти на новий сайт
            </a>

            <p class="timer">Автоматичне перенаправлення через 5 секунд...</p>
        </div>
    </body>
</html>
